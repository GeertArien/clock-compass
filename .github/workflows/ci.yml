name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Migrations/generation need a value; CI uses a throwaway local SQLite file.
      DATABASE_URL: "file:./ci.db"
    steps:
      - uses: actions/checkout@v5

      # pnpm via Corepack (respects the pinned packageManager in package.json).
      # Avoids pnpm/action-setup, which still runs on the deprecated Node 20.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema & migrations
        run: |
          pnpm --filter @clock-compass/core exec prisma validate
          pnpm --filter @clock-compass/core exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Build the production Docker image and smoke-test it (migrations apply on
  # boot, the server serves /api/health). Catches Dockerfile/runtime regressions
  # on PRs, before the release workflow publishes from main.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Plain docker CLI (no JS actions) keeps this Node-20-free.
      - name: Build image
        run: docker build -t clock-compass:ci .

      - name: Smoke test the running container
        run: |
          docker run -d --name clock-compass -p 3000:3000 -e API_AUTH_TOKEN=ci-token clock-compass:ci
          for i in $(seq 1 30); do
            if wget -qO- http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "health OK"; ok=1; break
            fi
            sleep 2
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "health check failed; container logs:"; docker logs clock-compass; exit 1
          fi

      # The MCP App (#118): start the MCP program in the running container, as
      # Claude Desktop does with `docker exec -i`, and check it offers the
      # screen tool and serves its page.
      - name: Smoke test the MCP program with --app
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"resources/read","params":{"uri":"ui://clock-compass/screen"}}' \
            | (cat; sleep 5) | docker exec -i clock-compass node packages/mcp/dist/index.js --app > mcp.out
          grep -q '"name":"show_week"' mcp.out || { echo "no show_week tool"; cat mcp.out; exit 1; }
          grep -q 'text/html;profile=mcp-app' mcp.out || { echo "no App page"; head -c 2000 mcp.out; exit 1; }
          echo "MCP App OK"

      # #137: a database with a stored day that is not a plain date stops the
      # start BEFORE the migrations, so a refused start changes nothing.
      - name: An old stored day stops the start before the migrations
        run: |
          docker volume create cc-old
          docker run --rm -v cc-old:/data --entrypoint sh clock-compass:ci -c '
            packages/core/node_modules/.bin/prisma migrate deploy --schema packages/core/prisma/schema.prisma >/dev/null &&
            cd packages/core &&
            node -e "const { PrismaClient } = require(\"@prisma/client\"); const db = new PrismaClient();
              db.task.create({ data: { title: \"Old\", scheduledDay: new Date(\"2026-11-25T23:00:00.000Z\") } }).then(() => db.\$disconnect());"'
          set +e
          docker run --rm -v cc-old:/data clock-compass:ci > old.out 2>&1
          code=$?
          set -e
          cat old.out
          [ "$code" != "0" ] || { echo "expected a refused start"; exit 1; }
          grep -q "The server did not start and changed nothing" old.out || { echo "no refusal message"; exit 1; }
          if grep -q "Applying database migrations" old.out; then echo "migrations ran before the check"; exit 1; fi
          echo "refused before the migrations"

      - name: Report image size
        run: docker images clock-compass:ci --format '{{.Size}}'
