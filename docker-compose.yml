services:
  app:
    build:
      context: .
      # The version this build is (#140), when set in the shell; see the README
      # ("Building with the version"). Empty: the app says it is unknown.
      args:
        GIT_COMMIT: "${GIT_COMMIT:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
        GIT_TAG: "${GIT_TAG:-}"
    image: clock-compass:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      # Optional override (IANA name, e.g. Europe/Brussels). Leave it empty: the
      # server then uses the zone the app reports for MCP, API calls without
      # X-Time-Zone and push notification hours (UTC until the app is first
      # opened). Set it to pin that zone instead; it wins over the app's.
      TZ: "${TZ:-}"
      # SQLite DB lives on the named volume so it survives restarts.
      DATABASE_URL: "file:/data/dev.db"
      # Leave API_AUTH_TOKEN empty for an open single-user instance (the default).
      # Set it (via your shell or a .env file) to require a bearer token on the
      # API; then enter the same token in the web UI's settings (gear icon).
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-}"
      # AI is configured in the app (Settings → AI), not here. Its stored keys
      # and the ChatGPT sign-in are encrypted with SECRETS_KEY: generate it once
      # with `openssl rand -base64 32` and put it in your .env. Without it, no
      # key can be saved (providers without a key keep working).
      SECRETS_KEY: "${SECRETS_KEY:-}"
      # Web push (optional): generate once with
      #   npx web-push generate-vapid-keys
      # and keep the pair stable — regenerating invalidates every device's
      # push subscription.
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
    volumes:
      - clock-compass-data:/data
    restart: unless-stopped

  # Optional Postgres for later. To use it: switch the Prisma provider to
  # "postgresql", point DATABASE_URL here, and re-run migrations.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: clockcompass
  #     POSTGRES_PASSWORD: clockcompass
  #     POSTGRES_DB: clockcompass
  #   volumes:
  #     - clock-compass-pg:/var/lib/postgresql/data

volumes:
  clock-compass-data:
  # clock-compass-pg:
