<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Clock &amp; Compass — put your big rocks in first." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Clock &amp; Compass</title>
    <script>
      // The theme before the first paint (#95), so a dark-mode user sees no
      // light flash. Must agree with src/lib/theme.ts (theme.test.ts checks).
      (function () {
        var choice = "system";
        try {
          var stored = localStorage.getItem("clockcompass_theme");
          if (stored === "light" || stored === "dark" || stored === "system") choice = stored;
        } catch (e) {}
        var dark = choice === "dark" || (choice === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (dark) root.classList.add("dark");
        if (dark) root.style.colorScheme = "dark";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1e1b15" : "#f5f1e8");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
